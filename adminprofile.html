<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Profile</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            padding: 30px 20px;
            position: fixed;
            height: 100%;
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .sidebar a {
            display: block;
            padding: 12px 15px;
            color: #bdc3c7;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .sidebar a:hover {
            background-color: #34495e;
            color: white;
        }

        .profile-container {
            margin-left: 250px;
            width: calc(100% - 250px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .profile-card {
            width: 500px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .profile-card h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile-field {
            margin-bottom: 15px;
        }

        .profile-field label {
            display: block;
            margin-bottom: 5px;
        }

        .profile-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .profile-field input:disabled {
            background-color: #f1f1f1;
        }

        .profile-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            color: white;
        }

        .btn-edit { background-color: #4CAF50; }
        .btn-save { background-color: #2196F3; display: none; }
        .btn-cancel { background-color: #f44336; display: none; }

        .error-message {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .success-message {
            color: green;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Admin Dashboard</h2>
    <a href="addashboard.html">Dashboard</a>
    <a href="admin-dashboard.html">Manage Students</a>
    <a href="admin-profile.html">Admin Profile</a>
    <a href="admin-announce.html">Announcements</a>
    <a href="#" id="logout-link">Logout</a>
</div>

<div class="profile-container">
    <div class="profile-card">
        <h1>Admin Profile</h1>

        <form id="profile-form">
            <div class="profile-field">
                <label>Username</label>
                <input type="text" id="username" readonly>
            </div>

            <div class="profile-field">
                <label>Name</label>
                <input type="text" id="name" disabled>
            </div>

            <div class="profile-field">
                <label>Email</label>
                <input type="email" id="email" disabled>
            </div>

            <div class="profile-field">
                <label>Phone</label>
                <input type="tel" id="phone" disabled>
            </div>

            <div class="profile-field">
                <label>Position</label>
                <input type="text" id="position" disabled>
            </div>
        </form>

        <div class="profile-buttons">
            <button type="button" id="edit-btn" class="btn btn-edit">Edit</button>
            <button type="button" id="save-btn" class="btn btn-save">Save</button>
            <button type="button" id="cancel-btn" class="btn btn-cancel">Cancel</button>
        </div>

        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>
    </div>
</div>

<script>
    const usernameInput = document.getElementById('username');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');
    const positionInput = document.getElementById('position');

    const editBtn = document.getElementById('edit-btn');
    const saveBtn = document.getElementById('save-btn');
    const cancelBtn = document.getElementById('cancel-btn');

    const errorMessage = document.getElementById('error-message');
    const successMessage = document.getElementById('success-message');

    let originalProfileData = {};

    function checkAuth() {
        const adminData = JSON.parse(localStorage.getItem('adminData'));
        if (!adminData || !adminData.username) {
            alert("Session expired. Please login again.");
            window.location.href = 'admin-login.html';
            return null;
        }
        return adminData;
    }

    function loadProfileFromLocalStorage() {
        const adminData = JSON.parse(localStorage.getItem('adminData'));
        if (!adminData) return;

        usernameInput.value = adminData.username || '';
        nameInput.value = adminData.name || '';
        emailInput.value = adminData.email || '';
        phoneInput.value = adminData.phone || '';
        positionInput.value = adminData.position || '';

        originalProfileData = { ...adminData };
    }

    async function fetchAdminProfile() {
        const admin = checkAuth();
        if (!admin) return;

        try {
            const res = await fetch(`http://localhost:3000/admin/profile?username=${admin.username}`);
            if (!res.ok) return;

            const data = await res.json();
            nameInput.value = data.name || '';
            emailInput.value = data.email || '';
            phoneInput.value = data.phone || '';
            positionInput.value = data.position || '';

            localStorage.setItem('adminData', JSON.stringify(data));
            originalProfileData = { ...data };
        } catch (err) {
            console.error(err);
        }
    }

    function toggleEdit(isEdit) {
        [nameInput, emailInput, phoneInput, positionInput].forEach(i => i.disabled = !isEdit);
        editBtn.style.display = isEdit ? 'none' : 'block';
        saveBtn.style.display = isEdit ? 'block' : 'none';
        cancelBtn.style.display = isEdit ? 'block' : 'none';
        errorMessage.textContent = '';
        successMessage.textContent = '';
    }

    async function saveProfile() {
        const admin = checkAuth();
        if (!admin) return;

        const updatedProfile = {
            username: admin.username,
            name: nameInput.value,
            email: emailInput.value,
            phone: phoneInput.value,
            position: positionInput.value
        };

        try {
            const res = await fetch('http://localhost:3000/admin/update', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedProfile)
            });

            if (!res.ok) throw new Error("Update failed");

            localStorage.setItem('adminData', JSON.stringify(updatedProfile));
            originalProfileData = { ...updatedProfile };
            successMessage.textContent = "Profile updated successfully";
            toggleEdit(false);

        } catch (err) {
            errorMessage.textContent = err.message;
        }
    }

    function cancelEdit() {
        loadProfileFromLocalStorage();
        toggleEdit(false);
    }

    document.addEventListener('DOMContentLoaded', () => {
        checkAuth();
        loadProfileFromLocalStorage();
        fetchAdminProfile();
    });

    editBtn.onclick = () => toggleEdit(true);
    saveBtn.onclick = saveProfile;
    cancelBtn.onclick = cancelEdit;

    document.getElementById('logout-link').onclick = (e) => {
        e.preventDefault();
        localStorage.clear();
        window.location.href = 'admin-login.html';
    };
</script>

</body>
</html>
